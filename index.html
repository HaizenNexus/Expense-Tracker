<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="assets/expert.ico" type="image/x-icon">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Expense Tracker</h1>

        <section class="balance-container" aria-label="Account summary">
            <h2>Your Balance</h2>
            <h1 id="balance">$0.00</h1>

            <div class="summary">
                <div class="income">
                    <h3>Income</h3>
                    <p id="income-amount">$0.00</p>
                </div>
                <div class="expense">
                    <h3>Expenses</h3>
                    <p id="expense-amount">$0.00</p>
                </div>
            </div>
        </section>

        <section class="main-content">
            <section class="transaction-container" aria-labelledby="transactions-title">
                <h2 id="transactions-title">Transactions</h2>
                <ul id="transaction-list" aria-live="polite"></ul>
            </section>

            <section class="form-container" aria-labelledby="add-transaction-title">
                <h2 id="add-transaction-title">Add Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Enter description..." required maxlength="80">
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount..." step="0.01" required>
                        <small>Use negative (-) for expenses</small>
                    </div>

                    <button type="submit">Add Transaction</button>
                </form>
            </section>
        </section>
    </main>
</body>
</html>
